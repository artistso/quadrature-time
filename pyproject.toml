[project]
name = "qtime"
version = "1.0.0"
description = "Numerical companion to the Hilbert-Space Quadrature Conjecture manuscript"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]
authors = [{ name = "Steven Michael Allen Owens" }]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/artistso/quadrature-time"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
